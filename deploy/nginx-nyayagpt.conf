# Install with:
#   sudo cp deploy/nginx-nyayagpt.conf /etc/nginx/sites-available/nyayagpt
#   sudo ln -s /etc/nginx/sites-available/nyayagpt /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get HTTPS with:
#   sudo certbot --nginx -d api.nyayagpt.in
# certbot will rewrite this file to add the SSL block and a redirect —
# that's expected, don't hand-edit around it afterward.

server {
    listen 80;
    server_name api.nyayagpt.in;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}